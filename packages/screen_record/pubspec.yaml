name: screen_record
description: Records the phone screen (Android MediaProjection) to an MP4 file for WiFi Analytics.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.wifianalytics.screen_record
        pluginClass: ScreenRecordPlugin
