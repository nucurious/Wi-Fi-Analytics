name: wifi_analytics
description: WiFi Analytics - field network testing (iperf3 UDP/TCP, GPS, site, radio info).
publish_to: none
version: 1.4.1+24

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  cross_file: ^0.3.4
  mailer: ">=6.1.0 <8.0.0"   # Gmail SMTP for emailing results
  archive: ">=3.6.1 <5.0.0"  # zip container for the .xlsx workbook
  wakelock_plus: ">=1.2.0 <1.8.1"   # 1.8.1+ conflicts with geolocator (dbus)
  radio_info:
    path: packages/radio_info
  screen_record:
    path: packages/screen_record

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geofence/GeoFence_20260708.json
