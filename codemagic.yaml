# Codemagic cloud builds for WiFi Analytics.
# No Mac or local Flutter install needed. See BUILD_GUIDE.md.
#
# >>> Before your first iPhone build, change the TWO lines marked CHANGE-ME
# >>> to the Bundle ID you registered with Apple (they must match).

workflows:
  # ---------------------------------------------------------------- Android
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        BUNDLE_ID: com.example.wifianalytics   # CHANGE-ME (same as below)
        VERSION: 1.5.0
    scripts:
      - name: Show Flutter version
        script: flutter --version
      - name: Generate platform folders
        script: flutter create --no-pub --org com.wifianalytics --project-name wifi_analytics --platforms=android,ios .
      - name: Get packages
        script: flutter pub get
      - name: Apply WiFi Analytics settings
        script: APP_NAME=Wi-Fi_Analytics_v$VERSION dart run tool/setup.dart
      - name: Build APK
        script: |
          flutter build apk --release --build-name=$VERSION --build-number=$BUILD_NUMBER --dart-define=APP_NAME=Wi-Fi_Analytics_v$VERSION
          # File name carries the version (e.g. Wi-Fi_Analytics_v1.3.7.apk) so downloads can't be mixed up.
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Wi-Fi_Analytics_v$VERSION.apk
    artifacts:
      - build/app/outputs/flutter-apk/Wi-Fi_Analytics_v*.apk

  # ---------------------------------------------------------------- Android debug app
  # Separate app (installs next to the main one) that also records logcat.
  # After installing, grant log access once from a computer:
  #   adb shell pm grant com.example.analyticsdebug android.permission.READ_LOGS
  android-debug-apk:
    name: Android Debug APK (logcat)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        BUNDLE_ID: com.example.analyticsdebug
        VERSION: 1.2.0
        DEBUG_APP: "true"
    scripts:
      - name: Generate platform folders
        script: flutter create --no-pub --org com.wifianalytics --project-name wifi_analytics --platforms=android .
      - name: Get packages
        script: flutter pub get
      - name: Apply debug app settings
        script: APP_NAME=Analytics_debug_ver$VERSION dart run tool/setup.dart
      - name: Build APK
        script: |
          flutter build apk --release --build-name=$VERSION --build-number=$BUILD_NUMBER \
            --dart-define=DEBUG_APP=true --dart-define=APP_NAME=Analytics_debug_ver$VERSION
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Analytics_debug_ver$VERSION.apk
    artifacts:
      - build/app/outputs/flutter-apk/Analytics_debug_ver*.apk

  # ---------------------------------------------------------------- Video Call Analytics (Android)
  # Separate app (own application ID, installs next to the others) for video call sessions:
  # keeps logging in the background with a foreground service while a call app is on screen.
  video-call-apk:
    name: Video Call Analytics (Android)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        BUNDLE_ID: com.example.videocallanalytics
        APP_NAME: Video_Call_Analytics
        VIDEO_CALL: "true"
    scripts:
      - name: Generate platform folders
        script: flutter create --no-pub --org com.wifianalytics --project-name wifi_analytics --platforms=android .
      - name: Get packages
        script: flutter pub get
      - name: Apply app settings
        script: dart run tool/setup.dart
      - name: Build APK
        script: |
          VERSION=1.5.0
          flutter build apk --release --build-name=$VERSION --build-number=$BUILD_NUMBER \
            --dart-define=VIDEO_CALL=true --dart-define=APP_NAME=Video_Call_Analytics
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Video_Call_Analytics_v$VERSION.apk
    artifacts:
      - build/app/outputs/flutter-apk/Video_Call_Analytics_v*.apk

  # ---------------------------------------------------------------- Analytics-Prov (Android)
  # The heavier field version: everything in Video Call Analytics (foreground service keeps logging with the
  # screen off or another app in front) plus a phone health log (battery, thermal, memory, GPS and logging gaps).
  # Own application ID, installs next to the other apps.
  analytics-prov-apk:
    name: Analytics-Prov (Android)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        BUNDLE_ID: com.example.analyticsprov
        VERSION: "1.0"
        PROV: "true"
        VIDEO_CALL: "true"
    scripts:
      - name: Generate platform folders
        script: flutter create --no-pub --org com.wifianalytics --project-name wifi_analytics --platforms=android .
      - name: Get packages
        script: flutter pub get
      - name: Apply app settings
        script: APP_NAME=Analytics-Prov$VERSION dart run tool/setup.dart
      - name: Build APK
        script: |
          flutter build apk --release --build-name=$VERSION --build-number=$BUILD_NUMBER \
            --dart-define=PROV=true --dart-define=VIDEO_CALL=true --dart-define=APP_NAME=Analytics-Prov$VERSION
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Analytics-Prov$VERSION.apk
    artifacts:
      - build/app/outputs/flutter-apk/Analytics-Prov*.apk

  # ---------------------------------------------------------------- iPhone -> TestFlight
  ios-testflight:
    name: iPhone TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Name you gave the App Store Connect API key in Codemagic
      # (Team/User settings > Integrations > Developer Portal).
      app_store_connect: WiFi Analytics key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.wifianalytics   # CHANGE-ME
      vars:
        BUNDLE_ID: com.example.wifianalytics           # CHANGE-ME (same as above)
        VERSION: 1.5.0
    scripts:
      - name: Show Flutter version
        script: flutter --version
      - name: Generate platform folders
        script: flutter create --no-pub --org com.wifianalytics --project-name wifi_analytics --platforms=android,ios .
      - name: Get packages
        script: flutter pub get
      - name: Apply WiFi Analytics settings
        script: APP_NAME=Wi-Fi_Analytics_v$VERSION dart run tool/setup.dart
      - name: Install CocoaPods
        script: cd ios && pod install --repo-update
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$VERSION \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
